[package]
name = "cells"
version = "1.1.2"
description = "Spreadsheet editor for CSV, Excel and Google Sheets"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The program file is named like the app, so the Dock shows "Cells" in development too.
[[bin]]
name = "Cells"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cells_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
calamine = { version = "0.38.0", features = ["dates"] }
csv = "1.4.0"
encoding_rs = "0.8.44"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4"] }
chrono = "0.4.45"
dirs = "7.0.0"
tauri-plugin-dialog = "2.8.4"
reqwest = "0.13.5"
trash = "5.2.9"
tauri-plugin-clipboard-manager = "2.5.0"
ironcalc = "0.9.1"
ironcalc_base = "0.9.1"
regex = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# IronCalc 0.9.1 with fixes for slow whole-column ranges, see vendor/PATCHES.md.
[patch.crates-io]
ironcalc_base = { path = "vendor/ironcalc_base" }
